<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>校園生物資料填報</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0f1b2d;
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .form-card {
      width: 100%;
      max-width: 430px;
      background: #1d2b3f;
      border: 1px solid #35445a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .small-title {
      color: #42e6a4;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .gps-box {
      background: #091225;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #cbd5e1;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 11px 12px;
      background: #111c30;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #22d3ee;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .gps-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .gps-title {
      color: #22d3ee;
      font-size: 14px;
      font-weight: bold;
    }

    .retry-btn {
      border: none;
      background: transparent;
      color: #22d3ee;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
    }

    #gpsStatus {
      padding: 10px;
      border-radius: 6px;
      background: #101b2e;
      border: 1px solid #26364f;
      font-size: 14px;
      color: #cbd5e1;
    }

    #gpsError {
      margin-top: 8px;
      font-size: 12px;
      color: #fbbf24;
      line-height: 1.5;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #14b87a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 3px;
    }

    .submit-btn:hover {
      background: #0fa86e;
    }

    .submit-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
      display: none;
    }

    .success {
      display: block !important;
      background: #123827;
      color: #86efac;
      border: 1px solid #22c55e;
    }

    .error {
      display: block !important;
      background: #451a1a;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    .sending {
      display: block !important;
      background: #3a2d12;
      color: #fde68a;
      border: 1px solid #f59e0b;
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px;
        align-items: flex-start;
      }

      .form-card {
        margin-top: 15px;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="form-card">

      <div class="small-title">
        FIELD SURVEY TOOL
      </div>

      <h1>
        🌿 校園生物資料填報
      </h1>

      <p class="subtitle">
        時間於送出時自動抓取，GPS 載入時自動偵測。
      </p>

      <div class="gps-box">

        <div class="gps-title-row">

          <div class="gps-title">
            🌐 手機 GPS 定位
          </div>

          <button
            class="retry-btn"
            type="button"
            onclick="getLocation()"
          >
            重新取得定位
          </button>

        </div>

        <div id="gpsStatus">
          正在取得定位...
        </div>

        <div id="gpsError"></div>

      </div>

      <div class="form-group">

        <label for="location">
          校園觀察地點 *
        </label>

        <input
          type="text"
          id="location"
          placeholder="例如：生態池木棧道、操場西側樹林"
        >

      </div>

      <div class="form-group">

        <label for="species">
          物種名稱 *
        </label>

        <input
          type="text"
          id="species"
          placeholder="例如：白頭翁"
        >

      </div>

      <div class="form-group">

        <label for="quantity">
          數量與單位 *
        </label>

        <input
          type="text"
          id="quantity"
          placeholder="例如：3 隻、1 棵、大約 10 朵"
        >

      </div>

      <div class="form-group">

        <label for="note">
          備註說明（選填）
        </label>

        <textarea
          id="note"
          placeholder="例如：停留在樹枝上、正在草地覓食..."
        ></textarea>

      </div>

      <button
        class="submit-btn"
        id="submitButton"
        onclick="submitForm()"
      >
        📤 送出紀錄
      </button>

      <div id="result"></div>

    </div>

  </div>


  <script>

    /*
    ==========================================
    Google Apps Script 正式部署網址
    ==========================================
    */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxVsLnqRp6dcLUBcHYCuIEixSGCs-7Vc8Y-VeiBAerXxw-j3k3tmVykckMS2yeM6I9SRw/exec";


    /*
    ==========================================
    GPS 儲存變數
    ==========================================
    */

    let gpsValue = "";


    /*
    ==========================================
    頁面載入後自動取得 GPS
    ==========================================
    */

    window.addEventListener(
      "load",
      function () {
        getLocation();
      }
    );


    /*
    ==========================================
    取得 GPS
    ==========================================
    */

    function getLocation() {

      const gpsStatus =
        document.getElementById("gpsStatus");

      const gpsError =
        document.getElementById("gpsError");


      gpsStatus.textContent =
        "正在取得定位...";

      gpsError.textContent = "";

      gpsValue = "";


      if (!navigator.geolocation) {

        gpsStatus.textContent =
          "此瀏覽器不支援 GPS 定位";

        gpsError.textContent =
          "請改用支援定位功能的瀏覽器。";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function (position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          gpsValue =
            latitude.toFixed(6) +
            "," +
            longitude.toFixed(6);


          gpsStatus.textContent =
            "定位成功：" + gpsValue;

          gpsError.textContent = "";

        },


        function (error) {

          gpsStatus.textContent =
            "未取得 GPS";


          let message =
            "定位失敗：";


          switch (error.code) {

            case error.PERMISSION_DENIED:

              message +=
                "你拒絕了定位權限。";

              break;


            case error.POSITION_UNAVAILABLE:

              message +=
                "目前無法取得位置資訊。";

              break;


            case error.TIMEOUT:

              message +=
                "定位逾時，請重新嘗試。";

              break;


            default:

              message +=
                "發生未知錯誤。";

          }


          gpsError.textContent =
            "⚠ " + message;

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /*
    ==========================================
    送出表單
    ==========================================
    */

    async function submitForm() {

      const location =
        document
          .getElementById("location")
          .value
          .trim();

      const species =
        document
          .getElementById("species")
          .value
          .trim();

      const quantity =
        document
          .getElementById("quantity")
          .value
          .trim();

      const note =
        document
          .getElementById("note")
          .value
          .trim();

      const resultBox =
        document.getElementById("result");

      const submitButton =
        document.getElementById("submitButton");


      /*
      ==========================================
      必填欄位檢查
      ==========================================
      */

      if (!location) {

        showError(
          "請輸入校園觀察地點。"
        );

        return;
      }


      if (!species) {

        showError(
          "請輸入物種名稱。"
        );

        return;
      }


      if (!quantity) {

        showError(
          "請輸入數量與單位。"
        );

        return;
      }


      /*
      ==========================================
      取得送出當下時間
      ==========================================
      */

      const now =
        new Date();


      const datetime =
        now.toLocaleString(
          "zh-TW",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }
        );


      /*
      ==========================================
      建立要送出的 JSON
      ==========================================
      */

      const data = {

        datetime: datetime,

        location: location,

        gps:
          gpsValue ||
          "未取得 GPS",

        species: species,

        quantity: quantity,

        note: note

      };


      console.log(
        "準備送出的資料：",
        data
      );


      /*
      ==========================================
      顯示傳送中
      ==========================================
      */

      resultBox.className =
        "sending";

      resultBox.textContent =
        "資料傳送中...";

      submitButton.disabled =
        true;

      submitButton.textContent =
        "傳送中...";


      /*
      ==========================================
      傳送到 Google Apps Script
      ==========================================
      */

      try {

        await fetch(
          API_URL,
          {
            method: "POST",

            /*
            使用 no-cors
            避免 GitHub Pages 跨網域讀取失敗
            */

            mode: "no-cors",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(data)
          }
        );


        /*
        ==========================================
        no-cors 模式無法讀取 Apps Script 回傳內容
        所以這裡只代表請求已成功送出
        ==========================================
        */

        resultBox.className =
          "success";

        resultBox.textContent =
          "✅ 資料已送出！\n\n" +
          "請到 Google Sheet 確認是否新增資料。";


        /*
        ==========================================
        清空表單
        ==========================================
        */

        document.getElementById(
          "location"
        ).value = "";

        document.getElementById(
          "species"
        ).value = "";

        document.getElementById(
          "quantity"
        ).value = "";

        document.getElementById(
          "note"
        ).value = "";


      } catch (error) {

        console.error(
          "傳送錯誤：",
          error
        );


        showError(
          "資料送出失敗。\n\n" +
          "錯誤訊息：" +
          error.message
        );

      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "📤 送出紀錄";

      }

    }


    /*
    ==========================================
    顯示錯誤訊息
    ==========================================
    */

    function showError(message) {

      const resultBox =
        document.getElementById("result");

      resultBox.className =
        "error";

      resultBox.textContent =
        "❌ " + message;

    }

  </script>

</body>
</html>
