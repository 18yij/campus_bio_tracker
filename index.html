<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>校園生物資料填報</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0f1b2d;
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .form-card {
      width: 100%;
      max-width: 430px;
      background: #1d2b3f;
      border: 1px solid #35445a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .small-title {
      color: #42e6a4;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .subtitle {
      margin: 0 0 22px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
    }

    .api-box,
    .gps-box {
      background: #091225;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #cbd5e1;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 11px 12px;
      background: #111c30;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #22d3ee;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .gps-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .gps-title {
      color: #22d3ee;
      font-size: 14px;
      font-weight: bold;
    }

    .retry-btn {
      border: none;
      background: transparent;
      color: #22d3ee;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
    }

    #gpsStatus {
      padding: 10px;
      border-radius: 6px;
      background: #101b2e;
      border: 1px solid #26364f;
      font-size: 14px;
      color: #cbd5e1;
    }

    #gpsError {
      margin-top: 8px;
      font-size: 12px;
      color: #fbbf24;
      line-height: 1.5;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #14b87a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 3px;
    }

    .submit-btn:hover {
      background: #0fa86e;
    }

    .submit-btn:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      white-space: pre-wrap;
      display: none;
    }

    .success {
      display: block !important;
      background: #123827;
      color: #86efac;
      border: 1px solid #22c55e;
    }

    .error {
      display: block !important;
      background: #451a1a;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }

    @media (max-width: 600px) {
      .page {
        padding: 14px;
        align-items: flex-start;
      }

      .form-card {
        margin-top: 15px;
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="form-card">

      <div class="small-title">
        FIELD SURVEY TOOL
      </div>

      <h1>
        🌿 校園生物資料填報
      </h1>

      <p class="subtitle">
        時間於送出時自動抓取，GPS 載入時自動偵測。
      </p>


      <div class="api-box">
        <label for="apiUrl">
          Apps Script 部署網址（Web App URL）
        </label>

        <input
          type="text"
          id="apiUrl"
          value="https://script.google.com/macros/s/AKfycbxRZkfRHkOPJ3nCaT0y6et7as7wzhF_XOsV2hteKeCR/exec"
          readonly
        >
      </div>


      <div class="gps-box">

        <div class="gps-title-row">

          <div class="gps-title">
            🌐 手機 GPS 定位
          </div>

          <button
            class="retry-btn"
            type="button"
            onclick="getLocation()"
          >
            重新取得定位
          </button>

        </div>

        <div id="gpsStatus">
          正在取得定位...
        </div>

        <div id="gpsError"></div>

      </div>


      <div class="form-group">

        <label for="location">
          校園觀察地點 *
        </label>

        <input
          type="text"
          id="location"
          placeholder="例如：生態池木棧道、操場西側樹林"
          required
        >

      </div>


      <div class="form-group">

        <label for="species">
          物種名稱 *
        </label>

        <input
          type="text"
          id="species"
          placeholder="例如：水鹿、黑冠麻鷺、大花咸豐草"
          required
        >

      </div>


      <div class="form-group">

        <label for="quantity">
          數量與單位 *
        </label>

        <input
          type="text"
          id="quantity"
          placeholder="例如：3 隻、1 棵、大約 10 朵"
          required
        >

      </div>


      <div class="form-group">

        <label for="note">
          備註說明（選填）
        </label>

        <textarea
          id="note"
          placeholder="觀察紀錄，例如：成鳥正在草地覓食、群聚漂浮於水面..."
        ></textarea>

      </div>


      <button
        class="submit-btn"
        id="submitButton"
        onclick="submitForm()"
      >
        📤 送出紀錄
      </button>


      <div id="result"></div>

    </div>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxRZkfRHkOPJ3nCaT0y6et7as7wzhF_XOsV2hteKeCR/exec";


    let gpsValue = "";


    /*
    ================================
    頁面載入時自動定位
    ================================
    */

    window.addEventListener(
      "load",
      function () {
        getLocation();
      }
    );


    /*
    ================================
    取得 GPS
    ================================
    */

    function getLocation() {

      const gpsStatus =
        document.getElementById("gpsStatus");

      const gpsError =
        document.getElementById("gpsError");


      gpsStatus.textContent =
        "正在取得定位...";

      gpsError.textContent = "";

      gpsValue = "";


      if (!navigator.geolocation) {

        gpsStatus.textContent =
          "此瀏覽器不支援 GPS 定位";

        gpsError.textContent =
          "請改用支援 Geolocation 的瀏覽器。";

        return;
      }


      navigator.geolocation.getCurrentPosition(

        function (position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          gpsValue =
            latitude.toFixed(6) +
            "," +
            longitude.toFixed(6);


          gpsStatus.textContent =
            "定位成功：" + gpsValue;

          gpsError.textContent = "";

        },


        function (error) {

          gpsStatus.textContent =
            "未取得（定位失敗）";


          let message =
            "定位失敗：";


          switch (error.code) {

            case error.PERMISSION_DENIED:

              message +=
                "你拒絕了定位權限。請允許瀏覽器取得位置。";

              break;


            case error.POSITION_UNAVAILABLE:

              message +=
                "目前無法取得位置資訊。";

              break;


            case error.TIMEOUT:

              message +=
                "定位逾時，請重新取得。";

              break;


            default:

              message +=
                "發生未知錯誤。";

          }


          gpsError.textContent =
            "⚠ " + message;

        },


        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }


    /*
    ================================
    送出表單
    ================================
    */

    async function submitForm() {

      const location =
        document.getElementById("location")
          .value
          .trim();

      const species =
        document.getElementById("species")
          .value
          .trim();

      const quantity =
        document.getElementById("quantity")
          .value
          .trim();

      const note =
        document.getElementById("note")
          .value
          .trim();

      const resultBox =
        document.getElementById("result");

      const submitButton =
        document.getElementById("submitButton");


      /*
      必填檢查
      */

      if (!location) {

        showError(
          "請輸入校園觀察地點。"
        );

        return;
      }


      if (!species) {

        showError(
          "請輸入物種名稱。"
        );

        return;
      }


      if (!quantity) {

        showError(
          "請輸入數量與單位。"
        );

        return;
      }


      /*
      送出當下時間
      */

      const now =
        new Date();

      const datetime =
        now.toLocaleString(
          "zh-TW",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }
        );


      /*
      JSON 資料
      */

      const data = {

        datetime: datetime,

        location: location,

        gps:
          gpsValue ||
          "未取得 GPS",

        species: species,

        quantity: quantity,

        note: note

      };


      /*
      顯示送出中
      */

      resultBox.className = "";

      resultBox.style.display =
        "block";

      resultBox.textContent =
        "資料傳送中...";


      submitButton.disabled =
        true;

      submitButton.textContent =
        "傳送中...";


      /*
      POST 到 Apps Script
      */

      try {

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(data)

            }
          );


        const result =
          await response.json();


        if (result.success) {

          resultBox.className =
            "success";

          resultBox.textContent =
            "✅ 資料寫入成功！\n" +
            "試算表第 " +
            result.row +
            " 列";


          /*
          清空欄位
          */

          document.getElementById(
            "location"
          ).value = "";

          document.getElementById(
            "species"
          ).value = "";

          document.getElementById(
            "quantity"
          ).value = "";

          document.getElementById(
            "note"
          ).value = "";

        } else {

          throw new Error(
            result.message ||
            "Apps Script 回傳失敗"
          );

        }


      } catch (error) {

        console.error(error);


        showError(
          "資料送出失敗。\n\n" +
          error.message +
          "\n\n請確認 Apps Script 已正式部署，且權限設定正確。"
        );

      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "📤 送出紀錄";

      }

    }


    /*
    ================================
    錯誤訊息
    ================================
    */

    function showError(message) {

      const resultBox =
        document.getElementById("result");

      resultBox.className =
        "error";

      resultBox.textContent =
        "❌ " + message;

    }

  </script>

</body>
</html>
